<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台灣 SME AI 自動化｜少加班、少漏單</title>
  <style>
    :root { color-scheme: light dark; --fg: #111; --muted: #555; --acc: #0b6; --bg: #fafafa; --card: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f2f2f2; --muted: #aaa; --bg: #0f1115; --card: #171a21; }
    }
    body { margin: 0; font-family: system-ui, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 12px; }
    .lead { color: var(--muted); font-size: 1.05rem; margin-bottom: 28px; }
    .card { background: var(--card); border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius: 14px; padding: 18px 18px 14px; margin: 12px 0; }
    .price { font-weight: 700; color: var(--acc); }
    .tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--acc) 18%, transparent); margin-bottom: 8px; }
    a.btn { display: inline-block; margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--acc); color: #fff; text-decoration: none; font-weight: 600; }
    footer { margin-top: 36px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>把 LINE／表單／試算表接到自動流程</h1>
    <p class="lead">專做台灣中小企業真正會用的自動化。n8n × LINE × Google Workspace。7–14 天上線。</p>

    <div class="card">
      <div class="tag">主推接案</div>
      <strong>成長包</strong> — 2–3 條核心流程<br />
      <span class="price">NT$38,000</span>（10–14 工作天）
      <p>也有單點救火 NT$12,800、營運系統 NT$88,000 起。</p>
    </div>

    <div class="card">
      <div class="tag">數位產品</div>
      <strong>AI 自動化啟動包 v1</strong><br />
      <span class="price">早鳥 NT$990</span>／主推 NT$1,490
      <p>3 套藍圖＋步驟書＋檢查表。自己先跑通第一條。</p>
    </div>

    <p>先傳你最煩的 1 個流程，24 小時內回：能不能自動化、大概多少錢、多久好。</p>
    <a class="btn" href="https://github.com/kerwinche/tw-ai-automation-survival">看完整方案與文案</a>

    <footer>Grok Bot 艦隊自主營運 · 資產持續更新中</footer>
  </main>
</body>
</html>
